# See https://prek.j178.dev/ for more information
# yaml-language-server: $schema=https://raw.githubusercontent.com/j178/prek/refs/heads/master/prek.schema.json
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push

repos:
  # Self checks
  - repo: meta
    hooks:
      #- id: check-hooks-apply
      - id: check-useless-excludes

  # Text files
  - repo: builtin
    hooks:
      # plaintext fixers
      - id: trailing-whitespace
        exclude: '\.(log|patch)$'
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix, lf]
      # config syntax checkers
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      # filesystems checkers
      #- id: check-symlinks
      - id: check-executables-have-shebangs

  # Spell checker
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # frozen: v1.51.1
    hooks:
      - id: typos
      # From https://github.com/crate-ci/typos/issues/1473
      - id: typos
        alias: typos-commit-msg
        args: [--force-exclude]
        stages:
          - commit-msg

  # Markdown formatter
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        # https://mdformat.readthedocs.io/en/stable/users/plugins.html
        additional_dependencies:
          - mdformat-config
          - mdformat-footnote
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
          - mdformat-shfmt
          - mdformat-myst
          - mdformat-front-matters
        args: [--strict-front-matter]
        exclude: 'README\.md|CHANGELOG\.md'

  # Update README examples
  - repo: https://github.com/zimbatm/mdsh
    rev: eca79da623dab29ed132b6c4d26a26795c2499c2 # 0.9.2+
    hooks:
      - id: mdsh
        args: [README.md]
        pass_filenames: false
        always_run: true

  # Shell formatter
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt

  # Shell linter
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Python formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # frozen: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # TOML formatter
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 69174e0716a3900d9ada7f01f14c2514ed6fb965 # frozen: v1.9.1
    hooks:
      - id: tombi-format
      - id: tombi-lint

  # Check PKGBUILD and .SCRINFO
  - repo: local
    hooks:
      # Standard PKGBUILD analysis
      - id: namcap
        name: namcap
        language: system
        entry: namcap --info
        files: PKGBUILD
      # Newer PKGBUILD linter from ALPM
      - id: alpm-lint-check
        name: alpm-lint-check
        language: system
        entry: alpm-lint check --level suggest --verbose
        files: 'PKGBUILD|.SRCINFO'
        pass_filenames: 1
      # Guarantee up-to-date .SRCINFO
      - id: makepkg-printsrcinfo
        name: makepkg-printsrcinfo
        language: system
        shell: sh
        entry: makepkg --printsrcinfo > .SRCINFO
        files: 'PKGBUILD|.SRCINFO'
        pass_filenames: false
      # Validate generated .SRCINFO
      - id: alpm-srcinfo-validate
        name: alpm-srcinfo-validate
        language: system
        entry: alpm-srcinfo validate
        files: .SRCINFO
        pass_filenames: 1

  # License linter
  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459 # frozen: v6.2.0
    hooks:
      - id: reuse

minimum_prek_version: 0.5.9

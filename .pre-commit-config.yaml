# See https://pre-commit.com for more information
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # plaintext fixers
      - id: trailing-whitespace
        exclude: '\.(log|patch|ghostty)$'
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix, lf]
      # config syntax checkers
      - id: check-yaml
      - id: check-toml
      # filesystems checkers
      - id: check-symlinks
      - id: check-executables-have-shebangs

  # Markdown formatter
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # 1.0.0
    hooks:
      - id: mdformat
        # https://mdformat.readthedocs.io/en/stable/users/plugins.html
        additional_dependencies:
          - mdformat-config
          - mdformat-footnote
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
          - mdformat-shfmt
          - mdformat-myst
          - mdformat-front-matters
        args: [--strict-front-matter]

  # Python formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56 # v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # TOML formatter
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1376e3d73ce106474179c8adfda11d1e50b7d4dc # v1.1.6
    hooks:
      - id: tombi-format
      - id: tombi-lint

submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/main
# From <https://ficd.sh/blog/mirror-srht-to-github/>
image: alpine/latest
packages:
  - git
  - openssh
secrets:
  - e28c2e16-2a98-49ab-b36d-7262c3e0b032 # not an actual secret, see .gitconfig
  - 143247c8-5c93-4b43-8a43-de7eaaf99d8f # ~marmis/pkgbuilds:github-mirror@sr.ht
tasks:
  - mirror: |
      ssh-keyscan github.com >> ~/.ssh/known_hosts
      cd ./pkgbuilds
      git remote add github git@github.com:marmitar/pkgbuilds.git
      git push --mirror github
      echo "See https://github.com/marmitar/pkgbuilds/commits/$(git rev-parse --verify HEAD)"

submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/main
# From <https://ficd.sh/blog/mirror-srht-to-github/>
image: alpine/latest
packages:
  - git
  - openssh
secrets:
  - 0ef6e59f-da11-4905-aed6-d6b278b6d2eb # not an actual secret, see .gitconfig
  - 143247c8-5c93-4b43-8a43-de7eaaf99d8f # ~marmis/pkgbuilds:github-mirror@sr.ht
tasks:
  - mirror: |
      ssh-keyscan github.com >> ~/.ssh/known_hosts
      cd ./pkgbuilds
      git remote add github git@github.com:marmitar/pkgbuilds.git
      git push --mirror github
      printf 'See https://github.com/marmitar/pkgbuilds/commits/%s\n' "$(git rev-parse --verify HEAD)"
triggers:
  - action: email
    to: ~marmis <tiagodepalves@gmail.com>
    condition: failure

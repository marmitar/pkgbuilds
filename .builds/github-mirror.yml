submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/main
# From <https://ficd.sh/blog/mirror-srht-to-github/>
image: alpine/latest
packages:
  - git
  - openssh
secrets:
  - 6a3a0da2-06fb-4fe4-b096-b070ea9ae53d # not an actual secret, see .gitconfig
  - f46c2a2d-4839-4181-9b58-ac673e2fccf9
tasks:
  - mirror: |
      ssh-keyscan github.com >> ~/.ssh/known_hosts
      cd ./pkgbuilds
      git remote add github git@github.com:marmitar/pkgbuilds.git
      git push --mirror github
